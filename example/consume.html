<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumer — Socket Transfer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #212121; }
  .bar { background: #00897B; color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 500; }
  .bar small { font-size: 13px; opacity: .8; font-weight: 300; display: block; margin-top: 2px; }
  .container { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 20px; overflow: hidden; }
  .card h3 { padding: 16px 20px 8px; font-size: 15px; color: #616161; }
  .card-body { padding: 0 20px 20px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #9e9e9e; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s; }
  .field input:focus { border-color: #00897B; }
  .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s; }
  .btn-primary { background: #00897B; color: #fff; }
  .btn-primary:hover { background: #00695C; }
  .btn-primary:disabled { background: #80CBC4; cursor: not-allowed; }
  .btn-danger { background: #D32F2F; color: #fff; }
  .btn-danger:hover { background: #B71C1C; }
  .btn-outline { background: transparent; color: #00897B; border: 1px solid #00897B; }
  .btn-outline:hover { background: #E0F2F1; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; }
  .status.connected { background: #E8F5E9; color: #2E7D32; }
  .status.disconnected { background: #FFEBEE; color: #D32F2F; }
  .status.connecting { background: #FFF3E0; color: #E65100; }
  .status.subscribed { background: #E3F2FD; color: #1565C0; }
  .status.closed { background: #F5F5F5; color: #9E9E9E; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.green { background: #2E7D32; }
  .dot.red { background: #D32F2F; }
  .dot.orange { background: #E65100; animation: pulse 1s infinite; }
  .dot.blue { background: #1565C0; }
  .dot.gray { background: #9E9E9E; }
  @keyframes pulse { 50% { opacity: .4; } }
  .log { background: #263238; color: #ECEFF1; border-radius: 8px; padding: 16px; max-height: 400px; overflow-y: auto; font-family: 'Menlo', 'Consolas', monospace; font-size: 13px; line-height: 1.8; }
  .log .time { color: #607D8B; }
  .log .in { color: #82B1FF; }
  .log .out { color: #C3E88D; }
  .log .sys { color: #FFCB6B; }
  .log .err { color: #FF5370; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row .field { flex: 1; margin-bottom: 0; }
  .row .btn { white-space: nowrap; }
  .hidden { display: none; }
  .link-list { list-style: none; }
  .link-list li { padding: 10px 16px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color .2s, background .2s; }
  .link-list li:hover { border-color: #00897B; background: #E0F2F1; }
  .link-list li.active { border-color: #1565C0; background: #E3F2FD; }
  .link-list li .uuid { font-family: monospace; font-size: 13px; color: #616161; }
  .link-list li .name { font-weight: 500; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge.blue { background: #E3F2FD; color: #1565C0; }
</style>
</head>
<body>

<div class="bar">
  Consumer — Socket Transfer
  <small>手机端：查询可用链接，订阅连接，收发消息</small>
</div>

<div class="container">

  <div class="card" id="configCard">
    <h3>连接配置</h3>
    <div class="card-body">
      <div class="field">
        <label>服务器地址</label>
        <input id="url" value="ws://localhost:3000" placeholder="ws://host:port">
      </div>
      <div class="field">
        <label>UID</label>
        <input id="uid" value="57820726376" maxlength="11" placeholder="从 Producer 获取的11位UID">
      </div>
      <div class="field">
        <label>Token</label>
        <input id="token" value="767f6955938cb930aa0c37377b127875f0df368754d0c52586a9dfc99154c0a1" maxlength="64" placeholder="从 Producer 获取的64位Token">
      </div>
      <div style="margin-top:16px; display:flex; gap:8px; align-items:center;">
        <button class="btn btn-primary" id="connectBtn" onclick="doConnect()">连接</button>
        <button class="btn btn-danger hidden" id="disconnectBtn" onclick="doDisconnect()">断开</button>
        <span id="statusBadge" class="status disconnected"><span class="dot red"></span>未连接</span>
      </div>
    </div>
  </div>

  <div class="card hidden" id="linksCard">
    <h3 style="display:flex; justify-content:space-between; align-items:center;">
      可用链接
      <button class="btn btn-outline" onclick="doList()" style="font-size:12px; padding:6px 12px;">刷新</button>
    </h3>
    <div class="card-body">
      <ul class="link-list" id="linkList">
        <li style="color:#9e9e9e; cursor:default;">连接后自动查询</li>
      </ul>
    </div>
  </div>

  <div class="card hidden" id="sendCard">
    <h3>发送消息 <span id="targetBadge" class="badge blue"></span></h3>
    <div class="card-body">
      <div class="row">
        <div class="field">
          <input id="sendInput" value='{"id":"req_1","type":"list"}' placeholder="输入消息，按 Enter 发送" onkeydown="if(event.key==='Enter')doSend()">
        </div>
        <button class="btn btn-primary" onclick="doSend()">发送</button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="logCard">
    <h3>消息日志</h3>
    <div class="card-body">
      <div class="log" id="log"></div>
    </div>
  </div>

</div>

<script type="module">
import { createConsumer } from '../dist/consumer.browser.js';

let consumer = null;

document.getElementById('url').value = 'ws://' + location.href.split('//')[1].split('/')[0];

function log(cls, ...parts) {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.innerHTML = `<span class="time">${time}</span> <span class="${cls}">${parts.join(' ')}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setStatus(state) {
  const badge = document.getElementById('statusBadge');
  const labels = { connected: '已连接', disconnected: '未连接', connecting: '连接中...', subscribed: '已订阅', closed: '已关闭' };
  const dots = { connected: 'green', disconnected: 'red', connecting: 'orange', subscribed: 'blue', closed: 'gray' };
  badge.className = 'status ' + state;
  badge.innerHTML = `<span class="dot ${dots[state]}"></span>${labels[state]}`;

  document.getElementById('connectBtn').classList.toggle('hidden', state !== 'disconnected');
  document.getElementById('disconnectBtn').classList.toggle('hidden', state === 'disconnected');
  document.getElementById('linksCard').classList.toggle('hidden', state === 'disconnected');
  document.getElementById('logCard').classList.toggle('hidden', state === 'disconnected');
}

window.doConnect = function() {
  const url   = document.getElementById('url').value.trim();
  const uid   = document.getElementById('uid').value.trim();
  const token = document.getElementById('token').value.trim();

  if (!url || !uid || !token) { alert('请填写服务器地址、手机号和 Token'); return; }

  setStatus('connecting');
  log('sys', `正在连接 ${url} ...`);

  consumer = createConsumer({ url, uid, token });

  consumer.onStateChange((state) => {
    if (state === 'connected') {
      setStatus('connected');
      log('sys', '已连接，自动查询可用链接...');
      doList();
    } else if (state === 'disconnected') {
      setStatus('disconnected');
      document.getElementById('sendCard').classList.add('hidden');
      log('sys', '连接断开，自动重连中...');
    } else if (state === 'closed') {
      setStatus('closed');
      log('sys', '已关闭');
    }
  });

  consumer.onConnect((uuid) => {
    setStatus('subscribed');
    document.getElementById('sendCard').classList.remove('hidden');
    document.getElementById('targetBadge').textContent = '→ ' + uuid;
    log('sys', `已订阅: ${uuid}`);
    document.querySelectorAll('.link-list li').forEach(li => {
      li.classList.toggle('active', li.dataset.uuid === uuid);
    });
  });

  consumer.onBreak((code) => {
    document.getElementById('sendCard').classList.add('hidden');
    if (code === 10001) {
      log('err', '生产端断开');
      setStatus('connected');
    } else if (code === 10004) {
      log('sys', '凭证变更，重新查询...');
      setStatus('connected');
      doList();
    } else {
      log('err', `[BREAK] code: ${code}`);
      setStatus('connected');
    }
  });

  consumer.onMessage((msg) => {
    log('in', '← [RECV]', JSON.stringify(msg));
  });

  consumer.onError((err) => {
    log('err', err.message);
  });
};

window.doDisconnect = function() {
  if (consumer) consumer.close();
  consumer = null;
};

window.doList = async function() {
  if (!consumer?.connected) return;
  try {
    const list = await consumer.listConnections();
    renderLinks(list);
    log('sys', `查询到 ${list.length} 个可用链接`);
  } catch (err) {
    log('err', '查询失败: ' + err.message);
  }
};

function renderLinks(list) {
  const ul = document.getElementById('linkList');
  if (list.length === 0) {
    ul.innerHTML = '<li style="color:#9e9e9e; cursor:default;">暂无可用链接，请先启动 Producer</li>';
    return;
  }
  ul.innerHTML = list.map(c => `
    <li data-uuid="${c.uuid}" onclick="doSubscribe('${c.uuid}')">
      <div>
        <div class="name">${c.name}</div>
        <div class="uuid">${c.uuid}</div>
      </div>
      <button class="btn btn-primary" style="padding:6px 16px; font-size:12px;">订阅</button>
    </li>
  `).join('');
}

window.doSubscribe = function(uuid) {
  if (!consumer?.connected) return;
  log('sys', `正在订阅 ${uuid} ...`);
  consumer.subscribe(uuid);
};

window.doSend = function() {
  const input = document.getElementById('sendInput');
  const text = input.value.trim();
  if (!text || !consumer?.subscribedUuid) return;

  let message;
  try { message = JSON.parse(text); } catch { message = { text }; }

  consumer.send(message);
  log('out', '→ [SEND]', JSON.stringify(message));
  input.value = '';
};
</script>
</body>
</html>
